  <style>:root {
  color-scheme: light;
  --blue: #1468e8;
  --blue-deep: #0b4fb5;
  --ink: #17233a;
  --muted: #64748b;
  --surface: #ffffff;
  --page: #f3f6fb;
  --line: #e4ebf5;
}

* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0;
  min-width: 320px;
  background: var(--page);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}

button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }

.app-shell {
  width: 100%;
  max-width: 680px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--page);
  box-shadow: 0 0 45px rgba(23, 49, 86, 0.08);
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 28px 20px 26px;
  color: #fff;
  background: linear-gradient(135deg, #0d58ca 0%, #1476ee 56%, #49a8ff 100%);
}

.hero::after {
  position: absolute;
  right: -40px;
  bottom: -92px;
  width: 220px;
  height: 220px;
  content: "";
  border: 28px solid rgba(255,255,255,0.1);
  border-radius: 50%;
}

.hero-kicker {
  position: relative;
  z-index: 1;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .18em;
  opacity: .82;
}

.hero h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: clamp(23px, 6vw, 30px);
  line-height: 1.25;
  letter-spacing: .01em;
}

.hero p {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 10px 0 0;
  font-size: 13px;
  line-height: 1.65;
  opacity: .9;
}

.content { padding: 16px; }

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 40px;
  margin: 0 0 13px;
  padding: 8px 14px 8px 10px;
  border: 1px solid #cbd9ed;
  border-radius: 12px;
  color: var(--blue-deep);
  background: #fff;
  box-shadow: 0 2px 8px rgba(32, 72, 125, .08);
  font-weight: 700;
  cursor: pointer;
}

.back-button span { font-size: 25px; line-height: 18px; }
.section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 2px 2px 14px; }
.section-heading h2 { margin: 0; font-size: 20px; line-height: 1.35; }
.section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.eyebrow { display: block; margin-bottom: 5px; color: var(--blue); font-size: 12px; font-weight: 800; }
.count-badge { flex: none; padding: 5px 9px; border-radius: 999px; color: var(--blue); background: #e8f1ff; font-size: 12px; font-weight: 800; }

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  margin-bottom: 13px;
  padding: 0 12px;
  border: 1px solid #dce5f2;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 15px rgba(30, 67, 116, .06);
}

.search-box:focus-within { border-color: #79abf4; box-shadow: 0 0 0 3px rgba(20,104,232,.1); }
.search-icon { color: #71829a; font-size: 23px; transform: rotate(-20deg); }
.search-box input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 15px; }
.search-box input::placeholder { color: #9aa8ba; }
.search-box button { width: 30px; height: 30px; border: 0; border-radius: 50%; color: #6f7e91; background: #eef2f7; cursor: pointer; }

.card-list, .result-list { display: grid; gap: 11px; }
.nav-card, .result-card {
  display: flex;
  width: 100%;
  min-height: 76px;
  align-items: center;
  gap: 13px;
  padding: 14px;
  border: 1px solid rgba(218, 228, 241, .8);
  border-radius: 17px;
  color: inherit;
  background: var(--surface);
  box-shadow: 0 6px 19px rgba(29, 65, 112, .07);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}

.nav-card:hover, .result-card:hover { border-color: #b9d2f5; box-shadow: 0 9px 24px rgba(27, 73, 136, .11); transform: translateY(-1px); }
.nav-card:focus-visible, .result-card:focus-visible, .back-button:focus-visible { outline: 3px solid rgba(20,104,232,.26); outline-offset: 2px; }

.card-icon {
  display: inline-flex;
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 900;
}

.line-icon { color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.sequence-icon { color: var(--blue); background: #eaf2ff; }
.direction-icon { color: #176fa9; background: #e5f6ff; }
.result-icon { color: #087a67; background: #ddf7f0; }
.turn-icon { color: #a5501d; background: #fff0df; }
.card-body { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 4px; }
.card-body strong { font-size: 16px; line-height: 1.42; overflow-wrap: anywhere; }
.card-body small { color: var(--muted); font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
.card-body small b { color: #42536a; }
.note-line { color: #9a5a18 !important; }
.card-arrow { flex: none; color: #93a1b4; font-size: 26px; font-weight: 300; }

.station-info { display: grid; gap: 1px; margin-bottom: 13px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--line); }
.station-info > div { padding: 13px 15px; background: #fff; }
.station-info span { display: block; margin-bottom: 4px; color: #718096; font-size: 12px; font-weight: 700; }
.station-info a { color: var(--blue); font-size: 16px; font-weight: 800; text-decoration: none; }
.station-info p { margin: 0; color: #654817; font-size: 13px; line-height: 1.65; }
.station-info .note-panel { background: #fffaf1; }
.result-station-info { margin-top: 13px; margin-bottom: 0; }

.result-card { min-height: 112px; }
.result-kind { width: max-content; padding: 3px 8px; border-radius: 999px; color: #56677e; background: #edf2f7; font-size: 11px; font-weight: 800; }
.map-hint { margin-top: 3px; color: var(--blue) !important; font-weight: 700; }
.result-note { margin-top: 13px; padding: 13px 14px; border: 1px solid #efd5a8; border-radius: 14px; color: #725021; background: #fff9ee; font-size: 13px; line-height: 1.65; }

.empty-state { padding: 28px 18px; border: 1px dashed #cbd7e8; border-radius: 17px; color: #53647b; background: rgba(255,255,255,.65); text-align: center; }
.empty-state strong { color: #33435a; }
.empty-state p { margin: 6px 0 0; font-size: 13px; }
.warning-state { border-color: #e5c58c; background: #fffaf1; }
footer { padding: 24px 4px 10px; color: #95a2b4; font-size: 11px; text-align: center; }

@media (max-width: 420px) {
  .hero { padding: 24px 17px 22px; }
  .content { padding: 13px; }
  .nav-card, .result-card { padding: 13px 12px; border-radius: 15px; }
  .card-icon { width: 41px; height: 41px; flex-basis: 41px; border-radius: 13px; }
  .card-body strong { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

  const LINE_COLORS=['#1570ef','#4d64d7','#198f72','#d55d35','#8b5cc7','#1786a7','#bb4d86'];
  const state={lineIndex:null,stationIndex:null,kind:null,directionIndex:null,query:''};
  const app=document.getElementById('app');

  function esc(value){
    return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }
  function footer(){return '<footer>数据来源：公交接驳点电子坐标表</footer>'}
  function backButton(){return '<button class="back-button" type="button" data-back><span aria-hidden="true">‹</span> 返回</button>'}
  function kindLabel(kind){return kind==='pass'?'途经站':'折返站'}
  function kindIcon(kind){return kind==='pass'?'途':'折'}
  function cardIcon(text,className=''){return '<span class="card-icon '+className+'">'+esc(text)+'</span>'}
  function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}

  function renderHome(){
    const cards=LINES.map((line,index)=>
      '<button class="nav-card" type="button" data-line="'+index+'">'+
      '<span class="card-icon line-icon" style="background-color:'+LINE_COLORS[index%LINE_COLORS.length]+'">'+esc(line.id.replace('号线',''))+'</span>'+
      '<span class="card-body"><strong>'+esc(line.name)+'</strong><small>'+line.stations.length+' 个站点</small></span>'+
      '<span class="card-arrow" aria-hidden="true">›</span></button>'
    ).join('');
    app.innerHTML='<div class="section-heading"><div><h2>选择地铁线路</h2><p>共 '+LINES.length+' 条线路</p></div></div><div class="card-list">'+cards+'</div>'+footer();
  }

  function renderStations(line){
    const keyword=state.query.trim().toLowerCase();
    const filtered=line.stations.map((station,index)=>({station,index})).filter(({station})=>!keyword||station.name.toLowerCase().includes(keyword));
    const cards=filtered.map(({station,index})=>
      '<button class="nav-card station-card" type="button" data-station="'+index+'">'+
      cardIcon(station.seq,'sequence-icon')+
      '<span class="card-body"><strong>'+esc(station.name)+'</strong><small>联系电话：'+esc(station.phone||'无')+'</small>'+
      (station.note?'<small class="note-line">备注：'+esc(station.note)+'</small>':'')+'</span>'+
      '<span class="card-arrow" aria-hidden="true">›</span></button>'
    ).join('');
    const empty=filtered.length?'':'<div class="empty-state"><strong>没有找到相关车站</strong><p>请检查关键词后重新搜索</p></div>';
    app.innerHTML=backButton()+
      '<div class="section-heading"><div><h2>'+esc(line.name)+'</h2><p>请选择需要查询的地铁站</p></div><span class="count-badge">'+filtered.length+'站</span></div>'+
      '<label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input type="search" value="'+esc(state.query)+'" placeholder="输入地铁站名称" aria-label="搜索地铁站">'+
      (state.query?'<button type="button" data-clear aria-label="清空搜索">×</button>':'')+'</label>'+
      '<div class="card-list station-list">'+cards+'</div>'+empty+footer();
    const input=app.querySelector('input[type="search"]');
    if(input){
      input.addEventListener('input',event=>{state.query=event.target.value;renderStations(line);const next=app.querySelector('input[type="search"]');next?.focus();if(next)next.setSelectionRange(next.value.length,next.value.length)});
    }
  }

  function renderKinds(line,station){
    const availableKinds=['pass','turn'].filter(kind=>station.directions.some(direction=>direction[kind]));
    const descriptions={pass:'查看列车运行方向对应的途经接驳点',turn:'查看列车运行方向对应的折返接驳点'};
    const cards=availableKinds.map(kind=>
      '<button class="nav-card" type="button" data-kind="'+kind+'">'+cardIcon(kindIcon(kind),kind==='turn'?'turn-icon':'pass-icon')+
      '<span class="card-body"><strong>'+kindLabel(kind)+'</strong><small>'+descriptions[kind]+'</small></span><span class="card-arrow" aria-hidden="true">›</span></button>'
    ).join('');
    const note=station.note?'<div class="note-panel"><span>备注</span><p>'+esc(station.note)+'</p></div>':'';
    const empty=availableKinds.length?'':'<div class="empty-state warning-state"><strong>本站暂无可用接驳点</strong><p>请以现场组织和备注信息为准</p></div>';
    app.innerHTML=backButton()+
      '<div class="section-heading"><div><span class="eyebrow">'+esc(line.name)+'</span><h2>'+esc(station.name)+'</h2><p>请选择接驳类型</p></div></div>'+
      '<div class="station-info"><div><span>联系电话</span><a href="tel:'+esc(station.phone)+'">'+esc(station.phone||'无')+'</a></div>'+note+'</div>'+
      '<div class="card-list">'+cards+'</div>'+empty+footer();
  }

  function renderDirections(line,station,kind){
    const available=station.directions.map((direction,index)=>({direction,index})).filter(({direction})=>direction[kind]);
    const cards=available.map(({direction,index})=>
      '<button class="nav-card" type="button" data-direction="'+index+'">'+cardIcon('向','direction-icon')+
      '<span class="card-body"><strong>'+esc(direction.name)+'</strong><small>查看'+kindLabel(kind)+'接驳点</small></span><span class="card-arrow" aria-hidden="true">›</span></button>'
    ).join('');
    const empty=available.length?'':'<div class="empty-state warning-state"><strong>该类型暂无可用方向</strong><p>请返回选择其他接驳类型</p></div>';
    app.innerHTML=backButton()+
      '<div class="section-heading"><div><span class="eyebrow">'+esc(line.name)+' · '+esc(station.name)+' · '+kindLabel(kind)+'</span><h2>选择接驳方向</h2><p>请选择需要查询的列车运行方向</p></div></div>'+
      '<div class="card-list">'+cards+'</div>'+empty+footer();
  }

  function resultCard(kind,point){
    if(!point)return '<div class="empty-state warning-state"><strong>当前表格未填写地图链接</strong><p>请以现场组织和备注信息为准</p></div>';
    const turnClass=kind==='turn'?' turn-icon':'';
    return '<a class="result-card" href="'+esc(point.url)+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="card-icon result-icon'+turnClass+'">'+kindIcon(kind)+'</span><span class="card-body"><span class="result-kind">'+kindLabel(kind)+'</span><strong>'+esc(point.name)+'</strong>'+
      '<small><b>接驳口：</b>'+esc(point.exit)+'</small><small class="map-hint">点击打开百度地图导航</small></span><span class="card-arrow" aria-hidden="true">›</span></a>';
  }

  function renderResults(line,station,direction,kind){
    const note=station.note?'<div class="note-panel"><span>备注</span><p>'+esc(station.note)+'</p></div>':'';
    app.innerHTML=backButton()+
      '<div class="section-heading"><div><span class="eyebrow">'+esc(line.name)+' · '+esc(station.name)+' · '+kindLabel(kind)+'</span><h2>'+esc(direction.name)+'</h2><p>点击接驳点打开百度地图导航</p></div></div>'+
      '<div class="result-list">'+resultCard(kind,direction[kind])+'</div>'+
      '<div class="station-info result-station-info"><div><span>联系电话</span><a href="tel:'+esc(station.phone)+'">'+esc(station.phone||'无')+'</a></div>'+note+'</div>'+footer();
  }

  function render(){
    if(state.lineIndex===null){renderHome();return}
    const line=LINES[state.lineIndex];
    if(state.stationIndex===null){renderStations(line);return}
    const station=line.stations[state.stationIndex];
    if(state.kind===null){renderKinds(line,station);return}
    if(state.directionIndex===null){renderDirections(line,station,state.kind);return}
    renderResults(line,station,station.directions[state.directionIndex],state.kind);
  }

  app.addEventListener('click',event=>{
    const target=event.target.closest('button');
    if(!target)return;
    if(target.hasAttribute('data-back')){
      if(state.directionIndex!==null)state.directionIndex=null;
      else if(state.kind!==null)state.kind=null;
      else if(state.stationIndex!==null)state.stationIndex=null;
      else{state.lineIndex=null;state.query=''}
      render();scrollTop();return;
    }
    if(target.hasAttribute('data-clear')){state.query='';render();return}
    if(target.dataset.line!==undefined){state.lineIndex=Number(target.dataset.line);state.stationIndex=null;state.kind=null;state.directionIndex=null;state.query='';render();scrollTop();return}
    if(target.dataset.station!==undefined){state.stationIndex=Number(target.dataset.station);state.kind=null;state.directionIndex=null;render();scrollTop();return}
    if(target.dataset.kind!==undefined){state.kind=target.dataset.kind;state.directionIndex=null;render();scrollTop();return}
    if(target.dataset.direction!==undefined){state.directionIndex=Number(target.dataset.direction);render();scrollTop()}
  });

  render();
  </script>
</body>
</html>
